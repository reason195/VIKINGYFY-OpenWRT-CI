#CI项目
name: QCA-ALL

#CI计划
on:
  #自动编译：每6小时检查上游源码是否有更新，无更新则跳过编译
  schedule:
    - cron: '0 */6 * * *'
  #手动编译
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '手动调整插件包，多个请用\n符号隔开。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: 'false'
        required: false
        type: boolean
      CHECK_ONLY:
        description: '仅模拟定时任务检查上游是否有更新（不编译固件）。'
        default: 'false'
        required: false
        type: boolean

#CI权限
permissions: write-all

#CI任务
jobs:
  #检查上游源码更新
  check:
    name: Check Source Update
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      # check job 无 checkout，gh 无法从 git remote 解析仓库，必须显式指定
      GH_REPO: ${{github.repository}}
    outputs:
      skip: ${{steps.compare.outputs.skip}}
    steps:
      - name: Get Upstream Commit
        id: upstream
        #定时/仅检查时获取上游最新提交；手动触发（非仅检查）无需检查直接编译
        #获取失败时继续，按有更新处理
        if: github.event_name == 'schedule' || github.event.inputs.CHECK_ONLY == 'true'
        continue-on-error: true
        run: |
          echo "sha=$(gh api repos/VIKINGYFY/immortalwrt/commits/main --jq .sha)" >> $GITHUB_OUTPUT
      - name: Get Last Built Commit
        id: last
        if: github.event_name == 'schedule' || github.event.inputs.CHECK_ONLY == 'true'
        continue-on-error: true
        run: |
          LAST_TAG=$(gh release list --limit 30 --json tagName -q '.[].tagName' | grep '^IPQ60XX-WIFI-NO-VIKINGYFY-main-' | head -n 1)
          if [ -n "$LAST_TAG" ]; then
            echo "sha=$(gh release view "$LAST_TAG" --json body -q .body | grep -oP '(?<=提交：)[0-9a-f]+' | head -n 1)" >> $GITHUB_OUTPUT
          else
            echo "sha=" >> $GITHUB_OUTPUT
          fi
      - name: Compare
        id: compare
        run: |
          echo "CHECK_ONLY input = ${{github.event.inputs.CHECK_ONLY}}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${{github.event.inputs.CHECK_ONLY}}" != "true" ]]; then
            echo "手动触发，开始编译！"
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            UP_SHA="${{steps.upstream.outputs.sha}}"
            LAST_SHA="${{steps.last.outputs.sha}}"
            if [ -n "$LAST_SHA" ] && [ -n "$UP_SHA" ]; then
              # 短哈希先解析为完整 SHA，再走 compare API 判断（可正确处理 force-push/分叉）
              FULL_SHA=$(gh api "repos/VIKINGYFY/immortalwrt/commits/$LAST_SHA" --jq .sha 2>/dev/null)
              if [ -n "$FULL_SHA" ]; then
                READ=$(gh api "repos/VIKINGYFY/immortalwrt/compare/$FULL_SHA...$UP_SHA" --jq '.status + " " + (.ahead_by|tostring)' 2>/dev/null)
                STATUS=${READ%% *}
                AHEAD=${READ##* }
                if [ "$STATUS" = "identical" ]; then
                  echo "上游源码无更新，跳过编译！"
                  echo "skip=true" >> $GITHUB_OUTPUT
                else
                  echo "检测到上游源码更新（+${AHEAD:-?} 提交），开始编译！"
                  echo "skip=false" >> $GITHUB_OUTPUT
                fi
              else
                echo "上次构建哈希解析失败，按有更新处理，开始编译！"
                echo "skip=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "无法获取哈希，按有更新处理，开始编译！"
              echo "skip=false" >> $GITHUB_OUTPUT
            fi
          fi

  config:
    name: ${{matrix.CONFIG}}
    needs: check
    if: (github.event_name == 'workflow_dispatch' && github.event.inputs.CHECK_ONLY != 'true') || (github.event_name != 'workflow_dispatch' && needs.check.outputs.skip != 'true')
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [IPQ60XX-WIFI-NO]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [main]

    #调用公用编译核心WRT-CORE.yml
    uses: ./.github/workflows/WRT-CORE.yml
    #继承仓库 secrets（构建时注入敏感配置）
    secrets: inherit
    with:
      #编译配置
      WRT_CONFIG: ${{matrix.CONFIG}}
      #默认主题
      WRT_THEME: bootstrap
      #默认主机名
      WRT_NAME: OWRT
      #默认WIFI名称
      WRT_SSID: OWRT
      #默认WIFI密码
      WRT_WORD: 12345678
      #默认地址
      WRT_IP: 192.168.1.1
      #默认密码，仅作提示，修改无用
      WRT_PW: 无
      #源码链接
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      #源码分支
      WRT_BRANCH: ${{matrix.BRANCH}}
      #源码名称
      WRT_SOURCE: ${{matrix.SOURCE}}
      #插件调整
      WRT_PACKAGE: ${{inputs.PACKAGE}}
      #仅输出配置文件
      WRT_TEST: ${{inputs.TEST}}

  #定时任务检测到上游更新并完成编译后，Telegram 通知构建结果
  notify:
    name: Notify Build Result
    runs-on: ubuntu-latest
    needs: config
    if: github.event_name == 'schedule' && (needs.config.result == 'success' || needs.config.result == 'failure')
    env:
      GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      # notify job 无 checkout，gh 需显式指定仓库
      GH_REPO: ${{github.repository}}
    steps:
      - name: Send Telegram Notification
        # 未配置 TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID 时跳过，不报错
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{secrets.TELEGRAM_BOT_TOKEN}}
          TELEGRAM_CHAT_ID: ${{secrets.TELEGRAM_CHAT_ID}}
        run: |
          RESULT=${{needs.config.result}}
          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [ "$RESULT" = "success" ]; then
            EMOJI="🟢"
            TITLE="固件编译完成"
            RELEASE_URL=$(gh release list --limit 1 --json tagName,url -q '.[0].url' 2>/dev/null || true)
            RELEASE_NOTE="发布：${RELEASE_URL:-无}"
          else
            EMOJI="🔴"
            TITLE="固件编译失败"
            RELEASE_NOTE=""
          fi

          START=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at 2>/dev/null || true)
          END=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .updated_at 2>/dev/null || true)
          DURATION_NOTE=""
          if [ -n "$START" ] && [ -n "$END" ]; then
            DURATION_MIN=$(( ( $(date -d "$END" +%s) - $(date -d "$START" +%s) ) / 60 ))
            DURATION_NOTE="耗时：${DURATION_MIN} 分钟"
          fi

          MSG="${EMOJI} ${TITLE}（定时任务）
配置：IPQ60XX-WIFI-NO
结果：${RESULT}
上游：VIKINGYFY/immortalwrt
${RELEASE_NOTE}
${DURATION_NOTE}
运行：${RUN_URL}"
          curl -s --fail --max-time 30 -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MSG}"
